<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小杜賓動作預覽</title>
<style>
:root{--bg:#f6f1ea;--card:#fffaf3;--ink:#3a2f2a;--muted:#8a7b70;--line:#e6dccf;--desk:#cfe3f2;--desk2:#eef5fa;--bar:#39424e;--accent:#c9742f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a19;--card:#272322;--ink:#f1e8de;--muted:#a69a8f;--line:#3a3431;--desk:#2c3c4d;--desk2:#3a4e63;--bar:#11151a}}
:root[data-theme="dark"]{--bg:#1d1a19;--card:#272322;--ink:#f1e8de;--muted:#a69a8f;--line:#3a3431;--desk:#2c3c4d;--desk2:#3a4e63;--bar:#11151a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:26px 0 10px}
p.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:14px}
button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cell.wide{grid-column:1/-1}
.stage{background:linear-gradient(var(--desk2),var(--desk));border-bottom:8px solid var(--bar)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.cell.wide canvas{max-height:280px;width:auto;max-width:100%;margin:0 auto}
.label{padding:8px 12px 10px;font-size:14px}
.label small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>小杜賓動作預覽 v3</h1>
  <p class="sub">全部以 Gemini 生成的參考圖轉成像素圖。下方深色條代表 Windows 工作列。</p>
  <div class="controls"><span>毛色：</span><span id="coats"></span></div>
  <h2>日常</h2><div class="grid" id="daily"></div>
  <h2>照顧與互動</h2><div class="grid" id="care"></div>
  <h2>個性與搗蛋</h2><div class="grid" id="fun"></div>
</main>
<script src="sprites/sprites.js"></script>
<script>
const SP=window.SPRITES;
const FX={W:'#d6d6d6',P:'#d46a7e',U:'#4a90d9',u:'#2c5f9e',R:'#ff5c7a',r:'#c93a58',w:'#ffffff',F:'#b9e07e',f:'#86bd4c',Y:'#ffd84d',Z:'#5f84b3',p:'#7a4b24',q:'#a8703a',o:'#8a5a2c',x:'#2b2b2b'};
const COATS={
  '黑棕':{K:'#0b0b0b',S:'#1c1d1d',B:'#2e2f2f',H:'#4a4b4a',E:'#6e4420',D:'#9a5c2c',T:'#bd7840'},
  '紅棕':{K:'#2a120c',S:'#4a2216',B:'#6b3322',H:'#8c4c33',E:'#7a4a22',D:'#b0703a',T:'#dc9c5e'},
  '藍棕':{K:'#151a22',S:'#38414e',B:'#4f5b6b',H:'#6f7c8e',E:'#7a4e2a',D:'#a8693a',T:'#d39258'},
  '淺黃':{K:'#4a3a30',S:'#8a7262',B:'#a68c78',H:'#c4ab94',E:'#9a6c44',D:'#c4925e',T:'#e6be8e'}
};
let coat='黑棕';

// ── 站姿的局部變化：眨眼、搖尾巴 ──────────────
const STAND=SP.stand[0].rows, SW_=STAND[0].length, SH_=STAND.length;
function closeEyes(g){[[13,2],[13,3],[13,11],[13,12]].forEach(([y,x])=>g[y][x]='B');[[14,2],[14,3],[14,11],[14,12]].forEach(([y,x])=>g[y][x]='K');}
function halfEyes(g){[[13,2],[13,3],[13,11],[13,12]].forEach(([y,x])=>g[y][x]='K');}
function shift(g,rows,cols,dx,dy){const pts=[];rows.forEach(y=>cols.forEach(x=>{if(g[y][x]!=='.'){pts.push([y,x,g[y][x]]);g[y][x]='.';}}));
  pts.forEach(([y,x,c])=>{const ny=y+dy,nx=x+dx;if(ny>=0&&ny<g.length&&nx>=0&&nx<g[0].length)g[ny][nx]=c;});}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
function wag(g,d){if(!d)return;shift(g,range(21,22),range(33,40),d,0);shift(g,[23],range(33,40),Math.abs(d)>1?Math.sign(d):0,0);}

const cache={};
function render(key,rows,mod){const k=coat+'|'+key;if(cache[k])return cache[k];
  const g=rows.map(r=>r.split(''));mod&&mod(g);const P=COATS[coat];
  const cv=document.createElement('canvas');cv.width=g[0].length;cv.height=g.length;const c=cv.getContext('2d');
  g.forEach((row,y)=>row.forEach((ch,x)=>{if(ch==='.')return;c.fillStyle=P[ch]||FX[ch]||'#f0f';c.fillRect(x,y,1,1);}));
  return cache[k]=cv;}
const stand=(w=0,blink=false,half=false)=>render(`stand${w}${blink}${half}`,STAND,g=>{wag(g,w);blink&&closeEyes(g);half&&halfEyes(g);});
const pose=(name,i=0)=>render(name+i,SP[name][i].rows);

// 以腳底為基準畫狗；ax=水平對齊點（預設圖寬一半），flip=true 面向右
function draw(c,img,fx,fy,o={}){const sx=(o.sx||1)*(o.flip?-1:1),sy=o.sy||1,ax=o.ax??img.width/2;
  c.save();c.translate(Math.round(fx),Math.round(fy));
  if(o.rot){c.translate(0,-img.height/2*sy);c.rotate(o.rot);c.translate(0,img.height/2*sy);}
  c.scale(sx,sy);c.drawImage(img,-Math.round(ax),-img.height);c.restore();}

// ── 特效小圖 ────────────────────────────────
const HEART=[".RR..RR.","RwRRRRRR","RRRRRRRR","RRRRRRRR",".RRRRRr.","..RRRr..","...Rr..."];
const PUFF_S=["..FF..",".FFfF.","FFFFFf","FfFFFF",".FFfF.","..FF.."];
const PUFF_L=["...FFFF...",".FFFFfFFF.","FFfFFFFFfF","FFFFFFFFFF","FFFFfFFFFF",".FFfFFFFF.","...FFFF..."];
const SPARK=["...Y...","...Y...",".YYYYY.","YYYwYYY",".YYYYY.","...Y...","...Y..."];
const ZZ=["ZZZZZ","...Z.","..Z..",".Z...","ZZZZZ"];
const POOP=["....KK.....","...KqpK....","..KKKKKK...","..KpqppK...",".KKKKKKKK..",".KpppqppK..","KKKKKKKKKK.","KpqpppqppK.","KKKKKKKKKK."];
function blit(c,rows,x,y){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;c.fillStyle=FX[ch];c.fillRect(Math.round(x)+i,Math.round(y)+j,1,1);}});}
function flies(c,x,y,t){c.fillStyle=FX.x;const a=t/240;
  c.fillRect(Math.round(x+Math.cos(a)*6),Math.round(y+Math.sin(a*1.3)*3),1,1);c.fillRect(Math.round(x+Math.cos(a+3)*5),Math.round(y-2+Math.sin(a*1.1+2)*3),1,1);}

const W0=100,H0=96,GX=50,GY=96;
const wagF=(t,ms=140)=>[0,1,0,-1][(t/ms|0)%4];
const SCENES={daily:[
 {name:'待機',desc:'搖尾巴、偶爾眨眼',draw(c,t){draw(c,stand(wagF(t,180),(t%3400)<150),GX,GY);}},
 {name:'走路',desc:'在工作列上走來走去，走到邊緣會轉身',w:240,draw(c,t){
   const span=240-60,v=0.035,per=span*2/v,d=(t%per)*v,left=d<span,x=left?210-d:30+(d-span);
   const f=(t/150|0)%4,fr=SP.walk[f];draw(c,pose('walk',f),x,GY,{ax:fr.ax,flip:!left});}},
 {name:'坐下',desc:'乖乖坐著陪你',draw(c,t){draw(c,pose('sit'),GX,GY,{sy:(t/900|0)%2?1.015:1});}},
 {name:'睡覺',desc:'下巴靠在前腳上，呼吸起伏',draw(c,t){draw(c,pose('sleep'),GX,GY,{sy:(t/1000|0)%2?1.03:1});
   const k=(t%2600)/2600;blit(c,ZZ,GX+12+k*6,GY-40-k*14);if(k>.5)blit(c,ZZ,GX+10+(k-.5)*6,GY-40-(k-.5)*14);}},
 {name:'睡醒伸懶腰',desc:'睡飽 → 伸個大懶腰打哈欠 → 起身搖尾巴',draw(c,t){const k=t%6400;
   if(k<2400){draw(c,pose('sleep'),GX,GY,{sy:(t/1000|0)%2?1.03:1});const z=(k%2400)/2400;blit(c,ZZ,GX+12+z*6,GY-40-z*14);}
   else if(k<4200)draw(c,pose('stretch'),GX,GY,{sx:k<2600?.96:1});
   else draw(c,stand(wagF(t,120)),GX,GY);}},
],care:[
 {name:'吃飯',desc:'埋頭吃狗碗，咔滋咔滋',draw(c,t){const img=pose('eat');draw(c,img,GX,GY,{sy:(t/260|0)%2?1:.985});
   const k=(t%900)/900,bx=GX-img.width/2+10;c.fillStyle=FX.o;if(k<.6){c.fillRect(Math.round(bx-3-k*6),Math.round(GY-8-k*6+k*k*14),1,1);c.fillRect(Math.round(bx+8+k*5),Math.round(GY-9-k*5+k*k*12),1,1);}}},
 {name:'便便與清理',desc:'蹲著用力 → 噗通 → 很驕傲 → 點一下就清乾淨',draw(c,t){const k=t%6400,px=GX+22;
   if(k<1800){const img=pose('poop');draw(c,img,GX-6+(k>500&&k<1400?((k/80|0)%2):0),GY);if(k>1200)blit(c,POOP,px+2,GY-9);}
   else{draw(c,pose('sit'),GX-14,GY);
     if(k<4600){blit(c,POOP,px+2,GY-9);if(k>2600)flies(c,px+7,GY-16,t);}
     else if(k<5200){const s=((k/110|0)%2);blit(c,SPARK,px+s,GY-12-s);blit(c,SPARK,px+6-s,GY-8);}
     else{const hk=(k-5200)/1200;blit(c,HEART,GX-20,GY-62-hk*12);}}}},
 {name:'被摸頭',desc:'瞇起眼睛，尾巴搖不停',draw(c,t){draw(c,stand(wagF(t,90),true),GX,GY+((t/400|0)%2));
   const hk=(t%1400)/1400;blit(c,HEART,GX-24,GY-62-hk*14);if(hk>.4)blit(c,HEART,GX+8,GY-58-(hk-.4)*22);}},
 {name:'開心',desc:'主人回來了！蹦蹦跳',draw(c,t){const k=t%700,h=k<400?14*4*(k/400)*(1-k/400):0;
   draw(c,stand(wagF(t,70)),GX,GY-h,{sy:k>400&&k<480?.92:1});const hk=(t%1600)/1600;blit(c,HEART,GX+14,GY-60-hk*20);}},
],fun:[
 {name:'後空翻',desc:'蹲低、起跳、翻一圈、落地',draw(c,t){const k=t%2800;
   if(k<500)draw(c,stand(wagF(t)),GX,GY);
   else if(k<720)draw(c,stand(0,false,true),GX,GY,{sy:.88,sx:1.05});
   else if(k<1520){const p=(k-720)/800,h=30*4*p*(1-p),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;draw(c,stand(0,true),GX,GY-h,{rot:e*Math.PI*2});}
   else if(k<1680){draw(c,stand(0),GX,GY,{sy:.86,sx:1.07});blit(c,SPARK,GX-34,GY-14);blit(c,SPARK,GX+24,GY-12);}
   else{draw(c,stand(wagF(t,90)),GX,GY);if(k<2000){blit(c,SPARK,GX-32,GY-22);blit(c,SPARK,GX+26,GY-20);}}}},
 {name:'放臭屁',desc:'屁股一抖……噗～然後瞇眼裝無辜',draw(c,t){const k=t%3600;let dx=0;
   if(k>500&&k<900)dx=((k/60|0)%2)?1:-1;
   draw(c,stand(k<500?wagF(t):0,false,k>=900&&k<3000),GX+dx,GY);
   if(k>=900&&k<3200){const s=(k-900)/2300,bx=GX+17,by=GY-26;
     blit(c,PUFF_S,bx+s*4,by-s*10);if(s>.12)blit(c,PUFF_L,bx+4+s*6,by-8-s*12);if(s>.3)blit(c,PUFF_S,bx+12+s*3,by-2-s*14);}}},
]};

const coatsEl=document.getElementById('coats');
Object.keys(COATS).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',n===coat);
  b.onclick=()=>{coat=n;coatsEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};coatsEl.appendChild(b);});
const all=[];
Object.entries(SCENES).forEach(([sec,list])=>list.forEach(s=>{const d=document.createElement('div');d.className='cell'+(s.w?' wide':'');
  d.innerHTML=`<div class="stage"><canvas width="${s.w||W0}" height="${H0}"></canvas></div><div class="label">${s.name}<small>${s.desc}</small></div>`;
  document.getElementById(sec).appendChild(d);all.push([s,d.querySelector('canvas').getContext('2d')]);}));
function frame(t){all.forEach(([s,c])=>{c.clearRect(0,0,s.w||W0,H0);c.imageSmoothingEnabled=false;s.draw(c,t);});requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
