<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>狗狗像素編輯器</title>
<style>
:root{--bg:#1e1c1b;--panel:#2a2725;--line:#3d3835;--ink:#f1e8de;--muted:#a69a8f;--accent:#e08a3c;--ok:#5fb36b;--warn:#e0b23c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft JhengHei UI","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
select,button,input[type=range]{font:inherit;color:var(--ink)}
select,button{background:#35302d;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#1e1c1b}
button.primary{background:var(--accent);border-color:var(--accent);color:#1e1c1b;font-weight:600}
.frames{display:flex;gap:4px}
.frames button{min-width:34px}
.dirty::after{content:" ●";color:var(--warn)}
main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;overflow:auto;background:#151413;display:flex;align-items:center;justify-content:center}
#stage{image-rendering:pixelated;cursor:crosshair;margin:24px}
aside{width:300px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:14px}
aside h2{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sw{height:30px;border-radius:5px;border:2px solid transparent;cursor:pointer;position:relative}
.sw span{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff;text-shadow:0 0 2px #000}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw.erase{background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/10px 10px}
#preview{image-rendering:pixelated;background:linear-gradient(#3a4e63,#2c3c4d);border-bottom:6px solid #11151a;width:100%;border-radius:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
kbd{background:#35302d;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
footer{padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:16px}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#35302d;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;white-space:pre-wrap;max-width:70vw}
</style>
</head>
<body>
<header>
  <h1>🐾 狗狗像素編輯器</h1>
  <label>品種 <select id="breed"></select></label>
  <label>姿勢 <select id="pose"></select></label>
  <div class="frames" id="frames"></div>
  <span style="flex:1"></span>
  <label>預覽毛色 <select id="coat"></select></label>
  <button id="save" class="primary" title="Ctrl+S">💾 存檔</button>
  <button id="apply" title="執行 build_js.py，合併進程式資料">⚙ 套用到程式</button>
</header>
<main>
  <div id="stageWrap"><canvas id="stage"></canvas></div>
  <aside>
    <section>
      <h2>工具</h2>
      <div class="tools">
        <button data-tool="pen" title="B">✏️ 畫筆</button>
        <button data-tool="erase" title="E">🧽 橡皮擦</button>
        <button data-tool="pick" title="I">💧 吸管</button>
        <button data-tool="fill" title="G">🪣 油漆桶</button>
        <button data-tool="select" title="M">⬚ 框選移動</button>
        <button id="flip" title="水平翻轉這一格">↔ 翻轉</button>
        <button id="undo" title="Ctrl+Z">↶ 復原</button>
        <button id="redo" title="Ctrl+Y">↷ 重做</button>
        <button id="grow" title="畫布四周多留 4 格空白（存檔時會自動裁掉）">⤢ 擴大畫布</button>
      </div>
    </section>
    <section>
      <h2>顏色（右鍵＝橡皮擦）</h2>
      <div class="swatches" id="swatches"></div>
    </section>
    <section>
      <h2>對照</h2>
      <div class="row">
        <label>洋蔥皮 <select id="onion"><option value="off">關</option><option value="first" selected>第 1 格</option><option value="prev">上一格</option><option value="stand">站姿</option></select></label>
      </div>
      <div class="row" style="margin-top:6px">
        <label>放大 <input type="range" id="zoom" min="6" max="24" value="12"></label>
        <label><input type="checkbox" id="gridOn" checked> 格線</label>
      </div>
    </section>
    <section>
      <h2>動畫預覽</h2>
      <canvas id="preview" width="140" height="80"></canvas>
      <div class="row" style="margin-top:6px">
        <button id="play" class="on">⏸ 暫停</button>
        <label>速度 <select id="speed"><option value="150" selected>走路</option><option value="80">跑步</option><option value="400">慢動作</option></select></label>
      </div>
    </section>
    <section class="hint">
      <b>快捷鍵</b><br>
      <kbd>B</kbd> 畫筆 <kbd>E</kbd> 橡皮擦 <kbd>I</kbd> 吸管 <kbd>G</kbd> 油漆桶 <kbd>M</kbd> 框選<br>
      <kbd>,</kbd> <kbd>.</kbd> 上／下一格 <kbd>Ctrl+Z</kbd> 復原 <kbd>Ctrl+S</kbd> 存檔<br>
      框選後用 <kbd>←↑→↓</kbd> 或拖曳移動選取範圍；沒有框選時 <kbd>Shift+方向鍵</kbd> 移動整格。<br>
      存檔後按「套用到程式」，再重新建置 DobyPet 就能看到。手動改過的姿勢，重新匯入時不會被蓋掉。
    </section>
  </aside>
</main>
<footer><span id="pos">—</span><span id="info"></span></footer>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const PAD = 6;
const FX = {W:'#d6d6d6', P:'#d46a7e', U:'#4a90d9', u:'#2c5f9e', K:'#0b0b0b'};   // 杜賓等品種共用的顏色
const POSE_NAMES = {stand:'站', walk:'走路', sit:'坐', sleep:'睡', eat:'吃飯', poop:'便便', stretch:'伸懶腰'};

let breed = null;          // {id, meta, poses, manual}
let pose = 'walk', frameIdx = 0, tool = 'pen', color = null, coat = null;
let grids = {};            // pose -> [grid(二維字元陣列)]
let dirty = {};            // pose -> bool
let history = {};          // `${pose}/${i}` -> {undo:[], redo:[]}
let sel = null;            // 框選 {x0,y0,x1,y1}（含）
let Z = 12;

// ── 資料 ───────────────────────────────────
const api = (url, body) => fetch(url, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {}).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || j.output || r.status); return j; });

function toGrid(rows) {
  const w = rows[0].length + PAD * 2;
  const g = [];
  for (let i = 0; i < PAD; i++) g.push(Array(w).fill('.'));
  for (const r of rows) g.push([...'.'.repeat(PAD) + r + '.'.repeat(PAD)]);
  for (let i = 0; i < PAD; i++) g.push(Array(w).fill('.'));
  return g;
}
const cur = () => grids[pose][frameIdx];

function palette() {
  const p = {...FX, ...breed.meta.coats[coat]};
  return p;
}
function symbols() {
  const base = Object.keys(breed.meta.coats[coat]);
  const used = new Set();
  for (const p in grids) for (const g of grids[p]) for (const r of g) for (const c of r) if (c !== '.') used.add(c);
  return [...base, ...[...used].filter(c => !base.includes(c))];
}

async function loadBreeds() {
  const list = await api('/api/breeds');
  $('#breed').innerHTML = list.map(b => `<option value="${b.id}">${b.name}（${b.id}）</option>`).join('');
  const want = new URLSearchParams(location.search).get('breed') || (list.find(b => b.id === 'husky') || list[0]).id;
  $('#breed').value = want;
  await loadBreed(want);
}

async function loadBreed(id) {
  if (Object.values(dirty).some(Boolean) && !confirm('有還沒存檔的修改，確定要切換品種嗎？')) { $('#breed').value = breed.id; return; }
  breed = await api('/api/breed/' + id);
  grids = {}; dirty = {}; history = {}; sel = null;
  for (const p in breed.poses) grids[p] = breed.poses[p].map(f => toGrid(f.rows));
  coat = breed.meta.defaultCoat || Object.keys(breed.meta.coats)[0];
  $('#coat').innerHTML = Object.keys(breed.meta.coats).map(c => `<option>${c}</option>`).join('');
  $('#coat').value = coat;
  $('#pose').innerHTML = Object.keys(grids).map(p => `<option value="${p}">${POSE_NAMES[p] || p}</option>`).join('');
  pose = grids.walk ? 'walk' : Object.keys(grids)[0];
  $('#pose').value = pose;
  frameIdx = 0;
  color = symbols()[0];
  renderSwatches(); renderFrames(); draw();
}

// ── 介面 ───────────────────────────────────
function renderFrames() {
  const n = grids[pose].length;
  $('#frames').innerHTML = n > 1 ? grids[pose].map((_, i) => `<button class="${i === frameIdx ? 'on' : ''}" data-f="${i}">${i + 1}</button>`).join('') : '';
  $('#frames').querySelectorAll('button').forEach(b => b.onclick = () => { frameIdx = +b.dataset.f; sel = null; renderFrames(); draw(); });
  [...$('#pose').options].forEach(o => o.className = dirty[o.value] ? 'dirty' : '');
  $('#save').classList.toggle('dirty', Object.values(dirty).some(Boolean));
  $('#info').textContent = `${POSE_NAMES[pose] || pose}${n > 1 ? `　第 ${frameIdx + 1}/${n} 格` : ''}${breed.manual.includes(pose) ? '　（手動修改過）' : ''}`;
}

function renderSwatches() {
  const pal = palette();
  const syms = symbols();
  $('#swatches').innerHTML = `<div class="sw erase ${color === '.' ? 'sel' : ''}" data-c="." title="透明（橡皮擦）"></div>` +
    syms.map(c => `<div class="sw ${c === color ? 'sel' : ''}" data-c="${c}" style="background:${pal[c] || '#f0f'}" title="${c} ${pal[c] || ''}"><span>${c}</span></div>`).join('');
  $('#swatches').querySelectorAll('.sw').forEach(s => s.onclick = () => { color = s.dataset.c; if (tool === 'erase' || tool === 'pick') setTool('pen'); renderSwatches(); });
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  if (t !== 'select') sel = null;
  draw();
}

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms);
}

// ── 對齊（跟程式一樣：腳底對齊、水平用上半身重心） ─────────────
function anchorOf(g) {
  let top = -1, bottom = -1, left = 1e9;
  g.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') { if (top < 0) top = y; bottom = y; left = Math.min(left, x); } }));
  if (top < 0) return {ax: g[0].length / 2, bottom: g.length - 1};
  let sx = 0, n = 0;
  for (let y = top; y < Math.min(top + 25, g.length); y++) g[y].forEach((c, x) => { if (c !== '.') { sx += x; n++; } });
  return {ax: n ? sx / n : g[0].length / 2, bottom};
}

// ── 繪製 ───────────────────────────────────
const stage = $('#stage'), ctx = stage.getContext('2d');

function draw() {
  if (!breed) return;
  const g = cur(), H = g.length, W = g[0].length, pal = palette();
  stage.width = W * Z; stage.height = H * Z;
  // 棋盤格底
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#26232a' : '#2e2b31';
    ctx.fillRect(x * Z, y * Z, Z, Z);
  }
  // 洋蔥皮
  const ref = onionRef();
  if (ref) {
    const a = anchorOf(g), b = anchorOf(ref);
    const dx = Math.round(a.ax - b.ax), dy = a.bottom - b.bottom;
    ctx.globalAlpha = .28;
    ref.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') { ctx.fillStyle = pal[c] || '#f0f'; ctx.fillRect((x + dx) * Z, (y + dy) * Z, Z, Z); } }));
    ctx.globalAlpha = 1;
  }
  g.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') { ctx.fillStyle = pal[c] || '#f0f'; ctx.fillRect(x * Z, y * Z, Z, Z); } }));
  if ($('#gridOn').checked && Z >= 8) {
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x++) { ctx.moveTo(x * Z + .5, 0); ctx.lineTo(x * Z + .5, H * Z); }
    for (let y = 0; y <= H; y++) { ctx.moveTo(0, y * Z + .5); ctx.lineTo(W * Z, y * Z + .5); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.beginPath();
    for (let x = PAD; x <= W; x += 10) { ctx.moveTo(x * Z + .5, 0); ctx.lineTo(x * Z + .5, H * Z); }
    for (let y = PAD; y <= H; y += 10) { ctx.moveTo(0, y * Z + .5); ctx.lineTo(W * Z, y * Z + .5); }
    ctx.stroke();
  }
  if (sel) {
    ctx.strokeStyle = '#ffd84d'; ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
    ctx.strokeRect(sel.x0 * Z + 1, sel.y0 * Z + 1, (sel.x1 - sel.x0 + 1) * Z - 2, (sel.y1 - sel.y0 + 1) * Z - 2);
    ctx.setLineDash([]);
  }
}

function onionRef() {
  const mode = $('#onion').value;
  if (mode === 'off') return null;
  if (mode === 'stand') return pose === 'stand' ? null : grids.stand?.[0];
  if (mode === 'first') return frameIdx === 0 ? null : grids[pose][0];
  if (mode === 'prev') return grids[pose].length > 1 ? grids[pose][(frameIdx - 1 + grids[pose].length) % grids[pose].length] : null;
}

// ── 編輯 ───────────────────────────────────
const hkey = () => `${pose}/${frameIdx}`;
function snapshot() {
  const h = history[hkey()] ||= {undo: [], redo: []};
  h.undo.push(JSON.stringify(cur())); if (h.undo.length > 200) h.undo.shift();
  h.redo = [];
}
function markDirty() { dirty[pose] = true; renderFrames(); }
function undo() { const h = history[hkey()]; if (!h?.undo.length) return; h.redo.push(JSON.stringify(cur())); grids[pose][frameIdx] = JSON.parse(h.undo.pop()); sel = null; markDirty(); draw(); }
function redo() { const h = history[hkey()]; if (!h?.redo.length) return; h.undo.push(JSON.stringify(cur())); grids[pose][frameIdx] = JSON.parse(h.redo.pop()); sel = null; markDirty(); draw(); }

function setPx(x, y, c) { const g = cur(); if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y][x] = c; }
function line(x0, y0, x1, y1, c) {
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (;;) { setPx(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function fill(x, y, c) {
  const g = cur(), target = g[y]?.[x]; if (target === undefined || target === c) return;
  const q = [[x, y]];
  while (q.length) {
    const [px, py] = q.pop();
    if (py < 0 || py >= g.length || px < 0 || px >= g[0].length || g[py][px] !== target) continue;
    g[py][px] = c; q.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
  }
}
function shift(dx, dy, area) {
  const g = cur(), H = g.length, W = g[0].length;
  const a = area || {x0: 0, y0: 0, x1: W - 1, y1: H - 1};
  const pts = [];
  for (let y = a.y0; y <= a.y1; y++) for (let x = a.x0; x <= a.x1; x++) if (g[y][x] !== '.') { pts.push([x, y, g[y][x]]); g[y][x] = '.'; }
  for (const [x, y, c] of pts) setPx(x + dx, y + dy, c);
  if (area) { area.x0 += dx; area.x1 += dx; area.y0 += dy; area.y1 += dy; }
}
function grow(n = 4) {
  for (const p in grids) grids[p] = grids[p].map(g => {
    const W = g[0].length + n * 2, blank = () => Array(W).fill('.');
    return [...Array.from({length: n}, blank), ...g.map(r => [...Array(n).fill('.'), ...r, ...Array(n).fill('.')]), ...Array.from({length: n}, blank)];
  });
  history = {}; sel = null; draw();
}

// ── 滑鼠 ───────────────────────────────────
let drag = null;
const cell = e => { const r = stage.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / Z), Math.floor((e.clientY - r.top) / Z)]; };
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('mousedown', e => {
  const [x, y] = cell(e), right = e.button === 2;
  if (tool === 'pick') { const c = cur()[y]?.[x]; if (c) { color = c; setTool('pen'); renderSwatches(); } return; }
  if (tool === 'select') {
    if (sel && x >= sel.x0 && x <= sel.x1 && y >= sel.y0 && y <= sel.y1) { snapshot(); drag = {mode: 'move', x, y}; }
    else { drag = {mode: 'rect', x, y}; sel = {x0: x, y0: y, x1: x, y1: y}; draw(); }
    return;
  }
  snapshot();
  if (tool === 'fill') { fill(x, y, right ? '.' : color); markDirty(); draw(); return; }
  const c = right || tool === 'erase' ? '.' : color;
  setPx(x, y, c); drag = {mode: 'paint', x, y, c}; markDirty(); draw();
});
window.addEventListener('mousemove', e => {
  const [x, y] = cell(e);
  const g = breed && cur();
  if (g) $('#pos').textContent = (x >= 0 && y >= 0 && y < g.length && x < g[0].length) ? `x ${x - PAD}, y ${y - PAD}　${g[y][x] === '.' ? '透明' : g[y][x]}` : '—';
  if (!drag) return;
  if (drag.mode === 'paint') { line(drag.x, drag.y, x, y, drag.c); drag.x = x; drag.y = y; draw(); }
  else if (drag.mode === 'rect') { sel = {x0: Math.min(drag.x, x), y0: Math.min(drag.y, y), x1: Math.max(drag.x, x), y1: Math.max(drag.y, y)}; draw(); }
  else if (drag.mode === 'move' && (x !== drag.x || y !== drag.y)) { shift(x - drag.x, y - drag.y, sel); drag.x = x; drag.y = y; markDirty(); draw(); }
});
window.addEventListener('mouseup', () => drag = null);

// ── 鍵盤 ───────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (e.ctrlKey && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.ctrlKey && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey && k.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  const arrows = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
  if (arrows[k] && (sel || e.shiftKey)) { e.preventDefault(); snapshot(); shift(...arrows[k], sel); markDirty(); draw(); return; }
  if (k === 'Escape') { sel = null; draw(); return; }
  const tools = {b: 'pen', e: 'erase', i: 'pick', g: 'fill', m: 'select'};
  if (tools[k.toLowerCase()]) { setTool(tools[k.toLowerCase()]); return; }
  const n = grids[pose]?.length || 1;
  if (k === ',') { frameIdx = (frameIdx - 1 + n) % n; sel = null; renderFrames(); draw(); }
  if (k === '.') { frameIdx = (frameIdx + 1) % n; sel = null; renderFrames(); draw(); }
});

// ── 預覽動畫 ────────────────────────────────
const pv = $('#preview'), pctx = pv.getContext('2d');
let playing = true, tick = 0;
function drawPreview() {
  if (!breed) return;
  const frames = grids[pose], pal = palette();
  const i = playing ? tick % frames.length : frameIdx;
  const g = frames[i], a = anchorOf(g);
  pctx.clearRect(0, 0, pv.width, pv.height);
  const ox = Math.round(pv.width / 2 - a.ax), oy = pv.height - 1 - a.bottom;
  g.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') { pctx.fillStyle = pal[c] || '#f0f'; pctx.fillRect(ox + x, oy + y, 1, 1); } }));
}
function loop() { tick++; drawPreview(); setTimeout(loop, +$('#speed').value); }

// ── 存檔 ───────────────────────────────────
async function save() {
  const todo = Object.keys(dirty).filter(p => dirty[p]);
  if (!todo.length) { toast('沒有需要存檔的修改'); return; }
  try {
    for (const p of todo) {
      const r = await api(`/api/save/${breed.id}/${p}`, {frames: grids[p].map(g => ({rows: g.map(r => r.join(''))}))});
      grids[p] = r.frames.map(f => toGrid(f.rows));
      dirty[p] = false;
      if (!breed.manual.includes(p)) breed.manual.push(p);
    }
    history = {}; sel = null;
    renderFrames(); draw();
    toast(`已存檔：${todo.map(p => POSE_NAMES[p] || p).join('、')}\n記得按「套用到程式」`);
  } catch (err) { toast('存檔失敗：' + err.message, 5000); }
}

// ── 綁定 ───────────────────────────────────
$('#breed').onchange = e => loadBreed(e.target.value);
$('#pose').onchange = e => { pose = e.target.value; frameIdx = 0; sel = null; renderFrames(); draw(); };
$('#coat').onchange = e => { coat = e.target.value; renderSwatches(); draw(); };
$('#zoom').oninput = e => { Z = +e.target.value; draw(); };
$('#gridOn').onchange = draw;
$('#onion').onchange = draw;
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#grow').onclick = () => grow(4);
$('#flip').onclick = () => { snapshot(); grids[pose][frameIdx] = cur().map(r => [...r].reverse()); sel = null; markDirty(); draw(); };
$('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '⏸ 暫停' : '▶ 播放'; $('#play').classList.toggle('on', playing); };
$('#save').onclick = save;
$('#apply').onclick = async () => {
  if (Object.values(dirty).some(Boolean)) await save();
  try { const r = await api('/api/build', {}); toast('已套用到程式資料：\n' + r.output.trim() + '\n\n重新建置 DobyPet 後就會生效', 6000); }
  catch (err) { toast('套用失敗：' + err.message, 6000); }
};
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
window.addEventListener('beforeunload', e => { if (Object.values(dirty).some(Boolean)) { e.preventDefault(); e.returnValue = ''; } });

setTool('pen');
loadBreeds().then(loop).catch(err => toast('載入失敗：' + err.message, 8000));
</script>
</body>
</html>
